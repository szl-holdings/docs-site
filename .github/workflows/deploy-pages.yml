name: deploy-docs-pages

# Build the VitePress docs site and deploy to GitHub Pages.
# Install uses `npm ci` (lock-file-exact, reproducible).
# Root cause of prior ERESOLVE: package.json pinned markdown-it-mathjax3 ^5,
# but vitepress 1.6.x declares an (optional) peer markdown-it-mathjax3 ^4.
# Under npm 10 this peer conflict is fatal for `npm ci`. Fix = pin
# markdown-it-mathjax3 to ^4.3.2 (satisfies the peer) and regenerate the
# lockfile. No --legacy-peer-deps / --force bandaid is used.
#
# Canonical public URL: https://holdings.a-11-oy.com/docs-site/.
# DNS and Pages policy are managed outside this source workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      deployment_manifest_sha256: ${{ steps.bind.outputs.deployment_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Verify deployment evidence contract
        run: npm run test:deployment
      - name: Build docs
        run: npm run docs:build
      - name: Install hosted browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify browser experience contract
        run: npm run test:browser:built
      - name: Add .nojekyll
        run: touch docs/.vitepress/dist/.nojekyll
      - name: Verify current protected source before upload
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-protected-source.mjs
      - name: Bind artifact to protected source
        id: bind
        env:
          SOURCE_TREE_SHA: ${{ steps.source.outputs.source_tree }}
        run: npm run deployment:write
      - name: Verify artifact source binding
        env:
          SOURCE_TREE_SHA: ${{ steps.source.outputs.source_tree }}
        run: npm run deployment:verify
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
      - name: Verify current protected source before deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-protected-source.mjs
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  witness:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
      - name: Verify current protected source before witness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-protected-source.mjs
      - name: Witness source and critical public bytes
        env:
          EXPECTED_DEPLOYMENT_MANIFEST_SHA256: ${{ needs.build.outputs.deployment_manifest_sha256 }}
        run: node scripts/witness-deployment.mjs
      - name: Verify protected source remained current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-protected-source.mjs
